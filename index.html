<html>
    <body style="margin: 0; font-family: Arial, sans-serif; background: linear-gradient(darkblue, indigo); width: 100vw; height: 100vh; overflow: hidden;">
        <textarea id="material" 
                  placeholder="Enter your text here..." 
                  style="width: 90%; height: 100px; font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin: 10px auto; display: block;">
        </textarea>
        <button onclick="create()" 
                style="display: block; margin: 10px auto; padding: 10px 20px; font-size: 18px; color: white; background-color: #007BFF; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
            Create Video
        </button>
        <audio id="beat" src="beat.mp3"></audio>
        <style>
            @keyframes scrollUp {
                0% { top: 100%; }
                100% { top: -300%; }
            }
            .scroll-container {
                position: absolute;
                width: 100%;
                text-align: center;
                animation: scrollUp 120s linear infinite;
            }
        </style>
        <script>
            function create() {
                const audio = document.getElementById("beat");
                audio.currentTime = 0;
                audio.play();

                audio.addEventListener("timeupdate", function() {
                    if (audio.currentTime >= 12) {
                        audio.currentTime = 0;
                        audio.play();
                    }
                });

                const container = document.createElement("div");
                container.style.position = "absolute";
                container.style.width = "100vw";
                container.style.height = "100vh";
                container.style.top = "0";
                container.style.left = "0";
                container.style.display = "flex";
                container.style.justifyContent = "center";
                container.style.alignItems = "center";

                const slide = document.createElement("div");
                slide.style.backgroundImage = 'linear-gradient(blue, lightblue)';
                slide.style.width = "80%";
                slide.style.height = "80%";
                slide.style.textAlign = "center";
                slide.style.color = "white";
                slide.style.fontSize = "3vw";
                slide.style.padding = "2%";
                slide.style.overflow = "hidden";
                slide.style.position = "relative";

                container.appendChild(slide);
                document.body.appendChild(container);

                setTimeout(() => {
                    const text = document.getElementById("material").value;
                    const words = text.split(" ");
                    slide.innerHTML = "";

                    const scrollContainer = document.createElement("div");
                    scrollContainer.className = "scroll-container";
                    slide.appendChild(scrollContainer);

                    let lineText = "";

                    words.forEach((word, i) => {
                        lineText += word + " ";
                        if ((i + 1) % 5 === 0 || i === words.length - 1) {
                            const lineDiv = document.createElement("div");
                            lineDiv.textContent = lineText.trim();
                            lineDiv.style.marginBottom = "10px";
                            scrollContainer.appendChild(lineDiv);
                            lineText = "";
                        }
                    });

                    window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
                }, 1000);
            }
        </script>
    </body>
</html>
