<html>
    <body style="margin: 0; font-family: Arial, sans-serif; background: linear-gradient(darkblue, indigo); width: 100%; height: 100%;">
        <textarea id="material" 
                  placeholder="Enter your text here..." 
                  style="width: 100%; height: 100px; font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
        </textarea>
        <button onclick="create()" 
                style="display: block; margin: 10px auto; padding: 10px 20px; font-size: 18px; color: white; background-color: #007BFF; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
            Create Video
        </button>
        <audio id="beat" src="beat.mp3"></audio>
        <script>
            function create() {
                const audio = document.getElementById("beat");
                audio.currentTime = 0;
                audio.play();
                
                audio.addEventListener("timeupdate", function() {
                    if (audio.currentTime >= 12) {
                        audio.currentTime = 0;
                        audio.play();
                    }
                });

                const container = document.createElement("div");
                container.style.position = "absolute";
                container.style.width = "60%";
                container.style.height = "50%";
                container.style.top = "30%";
                container.style.left = "20%";
                container.style.borderRadius = "20px";
                container.style.boxShadow = "0 4px 10px rgba(0,0,0,0.3)";
                container.style.fontFamily = "Arial, sans-serif";

                const slide = document.createElement("div");
                slide.style.backgroundImage = 'linear-gradient(blue, lightblue)';
                slide.style.width = "100%";
                slide.style.height = "100%";
                slide.style.textAlign = "center";
                slide.style.color = "white";
                slide.style.fontSize = "2vw";
                slide.style.padding = "20px";
                slide.style.overflowY = "auto";
                slide.style.overflowX = "hidden";
                slide.style.borderRadius = "2vw"
                slide.innerHTML = document.getElementById("material").value;

                container.appendChild(slide);
                document.body.appendChild(container);

                const text = document.getElementById("material").value;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1;
                utterance.pitch = 1;
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            }
        </script>
    </body>
</html>
